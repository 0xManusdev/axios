[package]
name = "pw-engine"
edition.workspace = true
version.workspace = true

[dependencies]
dashmap = "6.2.1"
libloading = "0.9.0"
log = "0.4.35"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }

[dev-dependencies]
# Horloge virtuelle (start_paused) pour tester le lissage sans attendre.
tokio = { version = "1.54.1", features = ["test-util"] }
